<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carnet de menus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3DF5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F1FA; --surface:#FFFFFF; --ink:#241B3F; --muted:#6B6485; --line:#DDD8EE;
  --accent:#5B3DF5; --accent-ink:#FFFFFF; --soft:#E9E5FB; --warn:#B4531A; --warn-bg:#FFE9D6;
  --leaf:#2F7D3B; --leaf-bg:#D8F0D2;
  --cP:#FFE08A; --cT:#F6C48B; --cR:#BDE6D0; --cB:#F7BFC8; --cF:#CFCBF7; --cL:#C6E8A8; --cC:#B9DCE8;
  --plate-ink:#241B3F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121F; --surface:#221C33; --ink:#EFEAFB; --muted:#A79FC4; --line:#38304F;
    --accent:#8F7BFF; --accent-ink:#16121F; --soft:#2E2647; --warn:#FFB27A; --warn-bg:#4A2D1A;
    --leaf:#9EE08C; --leaf-bg:#274A24;
    --cP:#6B5A1E; --cT:#6B4A22; --cR:#245A43; --cB:#6B2C3A; --cF:#3F3A7A; --cL:#3F6A25; --cC:#2C5668;
    --plate-ink:#EFEAFB;
  }
}
:root[data-theme="dark"]{
  --bg:#16121F; --surface:#221C33; --ink:#EFEAFB; --muted:#A79FC4; --line:#38304F;
  --accent:#8F7BFF; --accent-ink:#16121F; --soft:#2E2647; --warn:#FFB27A; --warn-bg:#4A2D1A;
  --leaf:#9EE08C; --leaf-bg:#274A24;
  --cP:#6B5A1E; --cT:#6B4A22; --cR:#245A43; --cB:#6B2C3A; --cF:#3F3A7A; --cL:#3F6A25; --cC:#2C5668;
  --plate-ink:#EFEAFB;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;line-height:1.1}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.top h1{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-.02em}
.top p{margin:6px 0 0;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--soft);padding:5px;border-radius:22px}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.weekbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.wlabel{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(20px,3.4vw,28px)}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:16px}
.ctrl label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.ctrl select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;color:var(--ink)}
.ctrl .chk input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:12px;font-weight:700}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.ctrl .btn{margin-left:auto}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.sum h3{font-size:18px;margin-bottom:10px}
.bar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.bar span{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--plate-ink);min-width:0;overflow:hidden;white-space:nowrap;padding:0 6px}
.sumrow{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:14px;color:var(--muted);align-items:center}
.sumrow .alert{color:var(--warn);background:var(--warn-bg);padding:3px 10px;border-radius:999px;font-weight:700}
.sumrow .push{margin-left:auto;display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.plate{position:relative;display:flex;align-items:center;justify-content:center;height:120px;background:var(--tile,var(--soft))}
.plate .e{font-size:58px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.plate .slot{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px}
.plate .lock{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);font-size:16px}
.plate .lock[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cbody h3,.dish h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tl{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.tl:hover{text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.new{background:var(--accent);color:var(--accent-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.leaf{background:var(--leaf-bg);color:var(--leaf)}
.chip.st{background:var(--tile);color:var(--plate-ink)}
.chip.ap{background:transparent;border:1px solid var(--line);font-weight:500}
button.chip{border:0;font-size:14px;padding:5px 12px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.acts button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:5px 10px;font-size:14px;font-weight:600}
.acts button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.acts .grow{flex:1}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:20px;padding:40px 20px;text-align:center}
.empty .e{font-size:54px}
.empty h2{margin:8px 0;font-size:26px}
.empty p{color:var(--muted);max-width:46ch;margin:0 auto 16px}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px}
.shop ul{list-style:none;margin:10px 0 0;padding:0;columns:2 200px;column-gap:24px}
.shop li{padding:3px 0}
.shop label{display:flex;gap:8px;align-items:center}
.shop input{accent-color:var(--accent);width:18px;height:18px}
.shop .done{text-decoration:line-through;color:var(--muted)}
h2.sec{font-size:26px;margin:28px 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.taste{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.taste .chip{font-size:14px;padding:4px 12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.dish{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;align-items:flex-start}
.dish.off{opacity:.55}
.dish .mini{flex:none;width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--tile)}
.dish .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dish h3{font-size:16px}
.dish .acts{padding-top:0}
.dish .acts button{padding:3px 9px;font-size:13px}
.switch{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-left:auto}
.switch input{accent-color:var(--accent);width:16px;height:16px}
.vote{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;background:var(--bg);border-radius:12px;padding:6px 8px}
.vote .who{font-weight:700}
.vote .pair{display:flex;gap:4px;align-items:center}
.vote button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:1px 8px;font-size:15px}
.vote button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.vote button:disabled{opacity:.4;cursor:not-allowed}
.syncb{margin-left:6px}
.vstat{font-size:12.5px;font-weight:700;color:var(--muted);width:100%}
.vstat.ok{color:var(--leaf)} .vstat.no{color:var(--warn)}
details{font-size:14px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.comp{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.comp{grid-template-columns:1.3fr 1fr}.preview{position:sticky;top:12px;align-self:start}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.step h3{font-size:18px;margin-bottom:2px}
.step small{color:var(--muted)}
.gl{font-size:13px;font-weight:700;color:var(--muted);margin-top:12px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.opt{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);background:var(--bg);padding:5px 11px;border-radius:12px;font-weight:600;font-size:14.5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.opt.ban{text-decoration:line-through;opacity:.5;cursor:not-allowed}
.opt.out{opacity:.6}
.xo[aria-pressed="true"]{text-decoration:line-through;opacity:.55;border-style:dashed}
.xo:not([aria-pressed="true"]):hover{border-color:var(--warn)}
.preview .card{border-radius:24px}
.preview .plate{height:180px}
.preview .plate .e{font-size:88px}
.preview .around{position:absolute;inset:auto 0 8px 0;display:flex;justify-content:center;gap:4px;font-size:22px;flex-wrap:wrap}
.preview h3{font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;color:var(--ink)}
.note{font-size:13.5px;color:var(--muted)}
.months{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.months button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.months button[aria-pressed="true"]{background:var(--leaf);color:var(--surface);border-color:var(--leaf)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0}
.veg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.veg .ve{font-size:30px;line-height:1}
.veg b{font-weight:700}
.cal{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.cal table{border-collapse:separate;border-spacing:2px;width:100%;min-width:560px;font-size:13px}
.cal th{font-weight:700;color:var(--muted);padding:2px}
.cal td{height:22px;border-radius:5px;background:var(--bg)}
.cal td.on{background:var(--leaf-bg)}
.cal td.cur{outline:2px solid var(--leaf)}
.cal td.nm{text-align:left;background:none;white-space:nowrap;padding-right:10px}
.overlay{position:fixed;inset:0;background:rgba(20,12,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
@media(min-width:700px){.overlay{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0}
@media(min-width:700px){.modal{border-radius:24px}}
.modal .plate{height:130px}
.modal .mb{padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:26px}
.modal h4{margin:0 0 4px;font-family:'Bricolage Grotesque',sans-serif;font-size:17px}
.modal ul{margin:0;padding-left:20px}
.modal ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.closeb{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:36px;height:36px;background:var(--surface);font-size:18px}
.fr-fridge{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:14px 14px 16px;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.fr-fridge svg{width:100%;max-width:400px;height:auto;overflow:visible}
.fr-fridge .fb{fill:var(--cR);stroke:var(--ink);stroke-opacity:.25;stroke-width:2}
.fr-fridge .fz{fill:var(--cC);stroke:var(--ink);stroke-opacity:.25;stroke-width:2}
.fr-fridge .dd{fill:var(--cC);stroke:var(--ink);stroke-opacity:.25;stroke-width:2;stroke-linejoin:round}
.fr-fridge .dp{fill:#EAF8FF}
.fr-fridge .rk{stroke:#7FB7C9;stroke-width:4;stroke-linecap:round}
.fr-fridge .hd{fill:var(--ink);opacity:.35}
.fr-fridge .in.on{fill:url(#frg)}
.fr-fridge .in.off{fill:#0E2230}
.fr-fridge .gl{fill:#9FD3E3;opacity:.9}
.fr-fridge .dr{fill:#C6E8A8;stroke:#6FA05A;stroke-width:2;opacity:.55}
.fr-fridge .dh{fill:#6FA05A;opacity:.6}
.fr-fridge .fl{font:700 9.5px 'Figtree',sans-serif;fill:#5B6B7A}
.fr-fridge .off-t{font:700 15px 'Figtree',sans-serif;fill:#8FB4C4;text-anchor:middle}
.fr-fridge .bd{fill:var(--accent)}
.fr-fridge .bt{fill:var(--accent-ink);font:800 9px 'Figtree',sans-serif;text-anchor:middle}
.fr-fridge .fi text{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.fr-fridge .fi.pop{animation:fpop .5s ease-out;transform-box:fill-box;transform-origin:center}
.fr-fridge .fi.ghost{animation:fgone .9s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes fpop{0%{transform:translateY(-30px) scale(.2);opacity:0}70%{transform:translateY(0) scale(1.3);opacity:1}100%{transform:scale(1)}}
@keyframes fgone{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-30px) scale(.5)}}
.meter{width:100%;max-width:400px;height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--cR),var(--accent));border-radius:999px;transition:width .5s}
.fr-fcap{font-size:13.5px;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion: reduce){.fr-fridge .fi.pop{animation:none}.fr-fridge .fi.ghost{display:none}.meter span{transition:none}}
.fr-hero{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:28px;background:linear-gradient(135deg,var(--cC),var(--cR) 60%,var(--cP));color:var(--plate-ink);margin-bottom:14px}
.seg{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:999px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:10px 14px;border-radius:999px;font-weight:800;color:var(--muted);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.aisle{background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--rc);border-radius:20px;padding:12px 14px 6px;margin-bottom:12px}
.shrow{display:flex;gap:10px;align-items:center;min-height:46px;padding:4px 0;border-top:1px dashed var(--line)}
.aisle .shelf-h + .shrow{border-top:0;margin-top:4px}
.shrow input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.shrow .em{font-size:24px;flex:none}
.shrow b{font-weight:700}
.shrow .qty{margin-left:auto;font-weight:800;background:var(--rc);color:var(--plate-ink);border-radius:999px;padding:0 10px}
.shrow.done b,.shrow.done .em{text-decoration:line-through;opacity:.5}
.fr-hero svg{width:min(44vw,190px);height:auto;flex:none;overflow:visible}
.fr-hero small{font-weight:700;display:block;margin-bottom:8px}
.fgauge{height:14px;border-radius:999px;background:var(--surface);overflow:hidden;margin:2px 0 4px}
.fgauge span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#2EB67D);transition:width .5s ease}
.fi{transform-box:fill-box;transform-origin:center}
.fi.pop{animation:fpop .55s ease-out}
@keyframes fpop{0%{transform:translateY(-34px) scale(.3);opacity:0}70%{transform:translateY(3px) scale(1.2);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.fi.pop{animation:none}.fgauge span{transition:none}}
.fr-hero h2{font-size:30px}
.fr-hero p{margin:4px 0 10px}
.fr-ice{font-size:66px;line-height:1;display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg)}}
@keyframes pop{0%{transform:scale(.8) rotate(var(--rot))}60%{transform:scale(1.1) rotate(var(--rot))}100%{transform:scale(1) rotate(var(--rot))}}
.fr-hero .chip{background:var(--surface);color:var(--ink)}
.fr-add{display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 5px 5px 18px;margin-bottom:10px}
.fr-add:focus-within{border-color:var(--accent)}
.fr-add input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;color:var(--ink)}
.fr-add .plus{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;font-weight:800;line-height:1;flex:none}
.fr-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.fr-cook{flex:none;scroll-snap-align:start;width:176px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.fr-cook .em{font-size:36px;line-height:1}
.fr-cook b{font-size:15px;line-height:1.2}
.shelf{background:var(--surface);border:1px solid var(--line);border-bottom:9px solid var(--rc);border-radius:24px;padding:14px 14px 18px;margin-bottom:16px}
.shelf-h{display:flex;align-items:center;justify-content:space-between;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px}
.shelf-h b{background:var(--rc);color:var(--plate-ink);border-radius:999px;padding:0 12px;font-size:15px}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:18px 12px;margin-top:16px}
.sk{position:relative;background:var(--rc);color:var(--plate-ink);border-radius:22px;padding:14px 6px 10px;text-align:center;transform:rotate(var(--rot,0deg));display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.sk.pop{animation:pop .35s ease-out}
.sk .em{font-size:38px;line-height:1}
.sk b{font-size:14px;line-height:1.15;padding:0 4px}
.sk .badge{position:absolute;top:-10px;right:-6px;min-width:30px;height:30px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid var(--surface)}
.sk .last{font-size:11.5px;font-weight:700}
.sk .qb{display:flex;gap:8px;margin-top:4px}
.sk .qb button{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:22px;font-weight:800;line-height:1}

  const has = m=>arr.includes(m), out=[];

/* ================= Construction des plats ================= */
function autoTags(r){
  const t = new Set((r[4]||'').split(' ').filter(Boolean));
  const ing = r[5].toLowerCase();
  if(r[3]==='poulet') t.add('poulet');
  if(r[3]==='mer') t.add('poisson');
  if(r[2]==='P') t.add('pates');
  if(/courgette/.test(ing)) t.add('courgette');
  if(/avocat/.test(ing)) t.add('avocat');
  if(/lardons|bacon/.test(ing)) t.add('lardons');
  if(/jambon/.test(ing)) t.add('jambon');
  if(/oignon/.test(ing)) t.add('oignon');
  if(/butternut/.test(ing)) t.add('butternut');
  if(/pommes de terre/.test(ing)) t.add('pdt');
  if(/fromage|gruyère|emmental|comté|parmesan|mozzarella|cheddar|chèvre|boursin|kiri|reblochon|feta|ricotta|raclette/.test(ing)) t.add('fromage');
  return [...t];
}
function mk(id, r, kind){
  const rec = (r[7]||'').split(';');
  return {id, e:r[0], name:r[1], st:r[2], pr:r[3], tags:autoTags(r),
    ing:r[5].split(',').map(s=>s.trim()), m:(kind==='base' && r[6]==='m'),
    kind, from:'',
    ap:(rec[0]||'').split(',').filter(Boolean), t:+rec[1]||0, steps:(rec[2]||'').split('|').filter(Boolean)};
}
const BASE = BASE_ROWS.map((r,i)=>mk('b'+i,r,'base'));
var GEN=[], GENM={}, IDEAS={}, WC=null;
const DISC = DISC_ROWS.map((r,i)=>mk('d'+i,r,'new'));
DISC.forEach(d=>{ if(!(d.ap||[]).includes('CK') && (/risotto|soupe|velout|potage|curry|chili|bolognaise|ratatouille|mijot|blanquette|dahl|lentille|tajine|couscous|riz|pâtes|gnocchi|mac|lasagne/i.test(d.name) || (d.ing||[]).some(x=>/riz|pâtes|macaroni|spaghetti|boulgour|quinoa|semoule|lentille/i.test(x)))){ d.ap=(d.ap||[]).concat('CK'); } });

/* ================= Dates & saisons ================= */
const pad = n=>String(n).padStart(2,'0');
const iso = d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays = (d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
function defaultWeek(){
  const t = new Date(), dow = t.getDay();
  return iso(addDays(t, dow===0 ? 1 : 1-dow));
}
S.week = defaultWeek();
const curMonth = ()=>addDays(parseD(S.week),3).getMonth()+1;

function dishVegs(d){
  if(!d._v){
    const txt = d.ing.join(' ').toLowerCase().replace(/sauce tomate/g,'');
    d._v = VEG.filter(v=>v.m.length<12 && v.re.test(txt));
  }
  return d._v;
}
function inSeason(d, mo){
  const vs = dishVegs(d);
  if(!vs.length) return null;
  return vs.every(v=>v.m.includes(mo));
}
function seasonChip(d){
  const s = inSeason(d, curMonth());
  if(s===true) return `<span class="chip leaf">🌿 De saison</span>`;
  if(s===false) return `<span class="chip warn">Hors saison</span>`;
  return '';
}

/* ================= Plats & votes ================= */
const isPending = d => d.kind==='mine' && d.pending;
function allOwn(){ return [...BASE, ...DISC.filter(d=>S.adopted[d.id]), ...GEN.filter(d=>S.adopted[d.id]), ...S.custom.filter(d=>!d.pending)]; }
function candList(){ return [...DISC.filter(d=>!S.adopted[d.id]), ...S.custom.filter(d=>d.pending)]; }
function isCandidate(d){ return (d.kind==='new' && !S.adopted[d.id]) || isPending(d); }
function dishById(id){
  if(!id) return null;
  return BASE.find(d=>d.id===id) || DISC.find(d=>d.id===id) || GENM[id] || S.custom.find(d=>d.id===id) || IDEAS[id] || null;
}
function vstatus(id){
  const v = S.votes[id]||{a:0,l:0};
  if(S.prefs[id]===-1 || v.a===-1 || v.l===-1) return 'no';
  if(v.a===1 && v.l===1) return 'ok';
  return 'wait';
}
function adopt(id){
  if(id[0]==='d') S.adopted[id]=true;
  else { const c=S.custom.find(x=>x.id===id); if(c) c.pending=false; }
}
function whoLabel(slot){
  const nm = ((S.profile&&S.profile.slotNames)||{})[slot] || '';
  if(!S.who) return slot==='a' ? (nm||'Moi') : (nm||"L'autre");
  if(S.who===slot) return nm ? 'Moi ('+nm+')' : 'Moi';
  return nm || "L'autre";
}
function voteBox(id){
  const v = S.votes[id]||{a:0,l:0}, st = vstatus(id), me = S.who;
  const pair = w=>{
    const lab = whoLabel(w), d = (me && me!==w) ? ' disabled title="Chacun vote pour soi"' : '';
    return `<span class="pair"><span class="who">${esc(lab)}</span>
    <button data-act="vote" data-id="${id}" data-w="${w}" data-v="1" aria-pressed="${v[w]===1}" aria-label="${esc(lab)} : pour"${d}>👍</button>
    <button data-act="vote" data-id="${id}" data-w="${w}" data-v="-1" aria-pressed="${v[w]===-1}" aria-label="${esc(lab)} : contre"${d}>👎</button></span>`;
  };
  let msg = '';
  const other = me==='a' ? 'l' : 'a';
  if(st==='ok') msg = `<span class="vstat ok">Validé à deux, ajouté à la liste</span>`;
  else if(st==='no') msg = `<span class="vstat no">Refusé, je ne le proposerai plus (un 👍 de chaque côté pour revenir dessus)</span>`;
  else if(me==='a' || me==='l'){
    if(v[me]===1 && v[other]!==1) msg = `<span class="vstat">En attente de ${esc(whoLabel(other))}</span>`;
    else if(v[other]===1 && v[me]!==1) msg = `<span class="vstat">En attente de ton avis</span>`;
    else msg = `<span class="vstat">Il faut deux 👍 pour l'ajouter</span>`;
  }
  else if(v.a===1) msg = `<span class="vstat">En attente de ${esc(whoLabel('l'))}</span>`;
  else if(v.l===1) msg = `<span class="vstat">En attente de ton avis</span>`;
  else msg = `<span class="vstat">Il faut deux 👍 pour l'ajouter</span>`;
  return `<div class="vote" role="group" aria-label="Vote">${pair('a')}${pair('l')}${msg}</div>`;
}
function ownPool(){
  const p = allOwn().filter(d=>!S.off[d.id] && S.prefs[d.id]!==-1 && !excludedBy(d).length);
  const q = p.filter(d=>S.set.mush || !d.m);
  return q.length>=8 ? q : p;
}
function discoPool(){ return [...candList(), ...GEN.filter(d=>!S.adopted[d.id])].filter(d=>vstatus(d.id)!=='no' && !excludedBy(d).length); }

function isEx(c,key){ return !!S.excl[c+':'+key]; }
function excludedBy(d){
  const keys = Object.keys(S.excl), av = avoidTerms(); if(!keys.length && !av.length) return [];
  const raw = d.ing.join(' ').toLowerCase();
  const vt = raw.replace(/sauce tomate/g,''), rt = raw.replace(/vinaigre de riz|nouilles de riz/g,'');
  const out = av.filter(a=>raw.includes(a)).map(a=>'x:'+a);
  keys.forEach(k=>{
    const c = k[0], key = k.slice(2); let hit = false;
    if(c==='v'){ const v = VEG.find(x=>x.k===key); hit = !!(v && v.re.test(vt)); }
    else if(c==='b'){ const re = EXRE.b[key]; hit = !!(re && re.test(key==='riz'?rt:raw)); }
    else if(c==='p'){ const re = EXRE.p[key]; hit = !!(re && re.test(raw)); }
    else { const re = EXRE.f[key]; hit = !!(re && re.test(raw)); }
    if(hit) out.push(k);
  });
  return out;

const slotCount = m => ({soir7:7,soir5:5,midisoir14:14}[m]||7);

function prevIds(){

  return new Set(p ? p.slots.filter(Boolean).map(s=>s.id) : []);
}
function stCap(n){ return Math.max(2, Math.round(n/3.5)); }
function penalty(list, prev){
  const n = list.length, cap = stCap(n), pcap = Math.ceil(n/2.2), mo = curMonth();
  const sc={}, pc={}, seen={}; let p=0, mush=0;
  list.forEach((d,i)=>{
    if(!d) return;
    sc[d.st]=(sc[d.st]||0)+1; pc[d.pr]=(pc[d.pr]||0)+1;
    if(seen[d.id]) p+=50; seen[d.id]=1;
    if(d.m) mush++;
    const b = list[i-1];
    if(b && d.st!=='L' && b.st===d.st) p+=4;
    if(prev.has(d.id)) p+=3;
    if(S.set.ufr && WC && WC.get(d.id+'#m')>0) p+=2;
    if(S.set.season && inSeason(d,mo)===false) p+=3;
  });
  Object.keys(sc).forEach(k=>{ if(k!=='L' && sc[k]>cap) p+=10*(sc[k]-cap); });
  Object.keys(pc).forEach(k=>{ if(k!=='fromage' && k!=='veggie' && pc[k]>pcap) p+=2*(pc[k]-pcap); });
  if(mush>1) p+=6*(mush-1);
  return p;
}
function generate(){
  const n = slotCount(S.set.mode);
  const old = (S.plans[S.week] && S.plans[S.week].slots) || [];
  const slots = Array.from({length:n},(_,i)=>{ const o=old[i]; return (o && o.lock && dishById(o.id)) ? {id:o.id,lock:true,done:o.done} : null; });
  const fixed = new Set(slots.filter(Boolean).map(s=>s.id));
  const free = slots.map((s,i)=>s?-1:i).filter(i=>i>=0);
  const own = ownPool().filter(d=>!fixed.has(d.id)), idea = (S.set.ufr && fridgeCount()>=3) ? fridgeIdeas(24).filter(d=>!excludedBy(d).length) : [], disc = discoPool().filter(d=>!fixed.has(d.id)).concat(idea);
  const prev = prevIds();
  WC = new Map(); own.concat(disc).forEach(d=>{ WC.set(d.id,weight(d)); WC.set(d.id+'#m',missing(d).length); });
  let best=null, bp=1e9;
  for(let t=0;t<400;t++){
    const dn = Math.min(own.length?S.set.discover:free.length, disc.length, free.length);
    const pick = shuffle([...wsample(disc,dn), ...wsample(own,free.length-dn)]);
    const list = slots.map(s=>s?dishById(s.id):null);
    free.forEach((fi,k)=>{ list[fi]=pick[k]||null; });
    const p = penalty(list,prev)+Math.random()*.5;
    if(p<bp){bp=p;best=list;}
  }
  WC = null;
  best.forEach((d,i)=>{ if(!slots[i] && d) slots[i]={id:d.id,lock:false}; });
  slots.forEach(s=>{ if(s && s.id && IDEAS[s.id]){ s.id = ideaToCustom(IDEAS[s.id]).id; } });
  S.plans[S.week] = {mode:S.set.mode, slots};
  save();
}
function reroll(i){
  const plan = S.plans[S.week]; if(!plan) return;
  const list = plan.slots.map(s=>s?dishById(s.id):null);
  const used = new Set(list.filter(Boolean).map(d=>d.id));
  let cands = ownPool().filter(d=>!used.has(d.id));
  if(S.set.discover>0) cands = cands.concat(discoPool().filter(d=>!used.has(d.id)));
  let best=null, bp=1e9;
  wsample(cands,6).forEach(c=>{
    const l = list.slice(); l[i]=c;
    const p = penalty(l,prevIds())+Math.random();
    if(p<bp){bp=p;best=c;}
  });
  if(best){ plan.slots[i]={id:best.id,lock:false}; save(); }
}

function badges(d, withAp){
  let h = `<span class="chip st" ${tile(d.st)}>${esc(ST[d.st].n)}</span>`;
  if(isCandidate(d)) h += d.from ? `<span class="chip new">Variante de ${esc(d.from)}</span>` : `<span class="chip new">${d.kind==='mine'?'Ma création à valider':'À découvrir'}</span>`;
  else if(d.kind==='new' && d.from) h += `<span class="chip">Variante de ${esc(d.from)}</span>`;
  else if(d.kind==='mine') h += `<span class="chip">Ma création</span>`;
  h += seasonChip(d);
  if(S.pp&&S.pp[d.id]) h += `<span class="chip">👥 ${S.pp[d.id]} pers.</span>`;
  if(d.t) h += `<span class="chip">⏱ ${d.t} min</span>`;
  const ex = excludedBy(d); if(ex.length) h += `<span class="chip warn">Contient : ${esc(ex.map(k=>itemLabel(k).replace(/^\S+ /,'')).join(', '))}</span>`;
  const nt = nutTags(d);
  if(d.ready) h += '<span class="chip">🥡 Plat tout prêt</span>';
  if(d.ing.length && (!d.ready||d.kcal)) h += `<span class="chip">🔥 ~${nt.n.k} kcal/pers.</span><span class="chip ${nt.cal==='high'?'warn':''}">${{low:'🥗 Faible en calories',mid:'⚖️ Calories moyennes',high:'🍔 Riche en calories'}[nt.cal]}</span><span class="chip">${{hi:'💪 Riche en protéines',mid:'💪 Protéines moyennes',lo:'🌱 Peu protéiné'}[nt.pro]} · ~${nt.n.p} g</span>`;
  if(withAp) h += apChips(d);
  return h;
}

function viewWeek(){
  const n = slotCount(S.set.mode), plan = S.plans[S.week];
  const ws = parseD(S.week), we = addDays(ws,6);
  const fmt = d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  let h = `<div class="weekbar"><button class="ib" data-act="wprev" aria-label="Semaine précédente">‹</button>
    <div class="wlabel">Semaine du ${fmt(ws)} au ${fmt(we)}</div>
    <button class="ib" data-act="wnext" aria-label="Semaine suivante">›</button></div>`;
  h += `<div class="ctrl">
    <label>Repas <select data-sel="mode">
      <option value="soir7" ${S.set.mode==='soir7'?'selected':''}>Dîners, 7 jours</option>
      <option value="soir5" ${S.set.mode==='soir5'?'selected':''}>Dîners, lundi au vendredi</option>
      <option value="midisoir14" ${S.set.mode==='midisoir14'?'selected':''}>Midi et soir, 7 jours</option></select></label>
    <label>Nouveautés <select data-sel="discover">${[0,1,2,3].map(k=>`<option value="${k}" ${S.set.discover===k?'selected':''}>${k} par semaine</option>`).join('')}</select></label>
    <label class="chk"><input type="checkbox" data-sel="air" ${S.set.air?'checked':''}> Favoriser l'air fryer</label>
    <label class="chk"><input type="checkbox" data-sel="cook" ${S.set.cook?'checked':''}> Favoriser le Cookeo</label>
    <label class="chk"><input type="checkbox" data-sel="ufr" ${S.set.ufr?'checked':''}> Utiliser d'abord ce qu'il y a dans le frigo</label>

    <button class="btn ghost" data-act="deopen" data-id="">➕ Ajouter ma recette</button><button class="btn" data-act="gen">${plan?'Reproposer les repas non verrouillés':'Proposer ma semaine'}</button></div>`;
  if(!plan){
    return h + `<div class="empty"><div class="e">🍽️</div><h2>Rien de prévu cette semaine</h2>
      <p>Je compose ${n} repas dans ta liste, avec un féculent différent d'un jour à l'autre, des légumes de saison et ${S.set.discover} nouveauté${S.set.discover>1?'s':''} à tester.</p>
      <button class="btn" data-act="gen">Proposer ma semaine</button></div>`;
  }
  const mode = plan.mode;
  const list = plan.slots.map(s=>s?dishById(s.id):null);
  const counts = {}; list.forEach(d=>{ if(d) counts[d.st]=(counts[d.st]||0)+1; });
  const total = list.filter(Boolean).length;
  const cap = stCap(list.length);
  const over = Object.keys(counts).filter(k=>k!=='L' && counts[k]>cap);
  const mush = list.filter(d=>d&&d.m).length;
  const af = list.filter(d=>d&&d.ap&&d.ap.includes('AF')).length;
  const seas = list.filter(d=>d&&inSeason(d,curMonth())===true).length;
  h += `<div class="sum"><h3>Féculents de la semaine</h3><div class="bar">${
    Object.keys(ST).filter(k=>counts[k]).map(k=>`<span style="flex:${counts[k]};background:var(${ST[k].v})" title="${esc(ST[k].n)}">${esc(ST[k].n.split(' ')[0].replace(',',''))} ×${counts[k]}</span>`).join('')
  }</div><div class="sumrow">
    <span>Même repas pour vous deux : ${total-mush} sur ${total}</span>
    <span>🍟 Air fryer : ${af} repas</span><span>🌿 De saison : ${seas} repas</span>
    ${fridgeCount()?`<span>🧊 Tout est dans le frigo : ${list.filter(d=>d&&!missing(d).length).length} repas</span>`:''}${S.set.cook?`<span>🥘 Cookeo : ${list.filter(d=>d&&d.ap&&d.ap.includes('CK')).length} repas</span>`:''}
    ${over.length?`<span class="alert">Beaucoup de ${esc(over.map(k=>ST[k].n.toLowerCase()).join(', '))}</span>`:''}
    <span class="push"><button class="btn ghost sm" data-act="shop">🛒 Liste de courses</button><button class="btn ghost sm" data-act="copy">Copier le menu</button></span></div></div>`;
  h += `<div class="grid">${list.map((d,i)=>weekCard(d,i,mode,plan)).join('')}</div>`;
  return h;
}

function viewDishes(){
  const own = allOwn(), f = profile();
  const top = Object.keys(f).sort((a,b)=>f[b]-f[a]).slice(0,8);

  let h = `<div class="row" style="margin-bottom:8px"><button class="btn sm" data-act="deopen" data-id="">➕ Ma recette</button> <button class="btn sm" data-act="ideasopen" data-v="any">🎲 Idées de recettes</button> <button class="btn sm" data-act="rdopen">🥡 Ajouter un plat tout prêt (pastabox, ravioles…)</button></div><h2 class="sec" style="margin-top:6px">Ce que j'ai repéré dans tes goûts</h2>

  h += `<h2 class="sec">Ta liste (${own.length} plats)</h2>
    <div class="filters" aria-label="Féculent">${[['all','Tous'],...Object.keys(ST).map(k=>[k,ST[k].n])].map(x=>`<button data-act="filter" data-v="${x[0]}" aria-pressed="${S.filter===x[0]}">${esc(x[1])}</button>`).join('')}</div>
    <div class="filters" aria-label="Appareil"><button data-act="apf" data-v="all" aria-pressed="${S.apf==='all'}">Tous appareils</button>${Object.keys(AP).map(k=>`<button data-act="apf" data-v="${k}" aria-pressed="${S.apf===k}">${AP[k][0]} ${esc(AP[k][1])}</button>`).join('')}

    <div class="filters" aria-label="Calories">${[['all','Toutes calories'],['low','🥗 Faibles en calories'],['mid','⚖️ Moyennes'],['high','🍔 Riches en calories']].map(x=>`<button data-act="nf" data-v="${x[0]}" aria-pressed="${(S.nf||'all')===x[0]}">${x[1]}</button>`).join('')}</div>
    <div class="filters" aria-label="Protéines">${[['all','Toutes protéines'],['hi','💪 Riches en protéines'],['mid','Moyennes'],['lo','🌱 Peu protéiné']].map(x=>`<button data-act="pf" data-v="${x[0]}" aria-pressed="${(S.pf||'all')===x[0]}">${x[1]}</button>`).join('')}</div>`;
  const shown = own.filter(okF);
  h += shown.length ? `<div class="dgrid">${shown.map(dishRow).join('')}</div>` : `<p class="lead">Aucun plat ne correspond à ces filtres.</p>`;
  const cands = candList(), wait = cands.filter(d=>vstatus(d.id)==='wait' && okF(d) && !excludedBy(d).length), no = cands.filter(d=>vstatus(d.id)==='no');
  h += `<h2 class="sec">Nouveautés à voter (${wait.length})</h2><p class="lead">Chacun donne son avis avec 👍 ou 👎. Avec deux 👍, le plat rejoint ta liste. Un 👎 et il ne sera plus proposé.</p>
    ${wait.length?`<div class="dgrid">${wait.map(candRow).join('')}</div>`:`<p class="lead">Rien en attente avec ces filtres.</p>`}`;
  if(no.length){

    <div class="acts"><button data-act="revote" data-id="${d.id}">Revoter</button></div></div></div>`).join('')}</div></details>`;
  }
  return h;
}

function fridgeCard(stock,total,mood){

  const ghost = (e,x,y,sz)=>`<g class="fi ghost"><text x="${x}" y="${y}" font-size="${sz}">${e}</text></g>`;
  let g = '';
  const counts = [];

    const front = its.slice(0,7), back = its.slice(7,13), over = its.length-13;

  const door = pick(['feculent','autre']), racks = [100,170,240,310,380];
  g += `<polygon class="dd" points="244,20 332,0 332,414 244,426"/><polygon class="dp" points="252,40 324,26 324,392 252,404"/>`;

  const pct = Math.min(100,Math.round(total/30*100));

  }
  h += `<details class="fr-cat" style="margin-top:20px"><summary>📚 Tout le catalogue (${cat.size} ingrédients)</summary>${RAY.map(r=>{

/* ================= Liste de courses (semaine / mois) ================= */
function shopMonth(){
  if(S.cm){ const [y,m]=S.cm.split('-').map(Number); return [y,m]; }
  const d=addDays(parseD(S.week),3); return [d.getFullYear(), d.getMonth()+1];
}
function shopData(){
  const mode = S.cmode||'week', entries = [];
  let label = '', weeks = 0, planned = 0; const missingWeeks = [];
  const fmt = d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  const take = (wk,pl,inRange)=>{
    const mon = parseD(wk);
    pl.slots.forEach((sl,i)=>{
      const d = sl && dishById(sl.id);
      const date = addDays(mon, pl.mode==='midisoir14' ? Math.floor(i/2) : i);
      if(d && !sl.done && inRange(date)) entries.push({d,date});
    });
  };
  if(mode==='week'){
    const ws=parseD(S.week); label = `Semaine du ${fmt(ws)} au ${fmt(addDays(ws,6))}`;
    const pl=S.plans[S.week]; weeks=1; if(pl){ planned=1; take(S.week,pl,()=>true); } else missingWeeks.push(S.week);
  } else {
    const [y,m]=shopMonth(); label = MN[m-1].charAt(0).toUpperCase()+MN[m-1].slice(1)+' '+y;
    const first=new Date(y,m-1,1), last=new Date(y,m,0);
    let mon=addDays(first,-((first.getDay()+6)%7));
    while(mon<=last){
      const wk=iso(mon), pl=S.plans[wk]; weeks++;
      if(pl){ planned++; take(wk,pl,date=>date.getMonth()===m-1 && date.getFullYear()===y); } else missingWeeks.push(wk);
      mon=addDays(mon,7);
    }
  }
  const need = new Map();
  entries.forEach(({d})=>{
    const seen = new Set();
    d.ing.forEach(x=>{
      const k=keyOf(x); if(seen.has(k)) return; seen.add(k);
      const c=catalog().get(k), e=need.get(k)||{k,name:c?c.n:x,e:c?c.e:'🛒',r:c?c.r:guessRayon(x),n:0};
      e.n++; need.set(k,e);
    });
  });
  const rem = {}; Object.keys(S.fridge).forEach(k=>{ rem[k]=S.fridge[k].q; });
  const order = RAY.map(r=>r.k);
  const rows = [...need.values()].sort((a,b)=>order.indexOf(a.r)-order.indexOf(b.r) || a.name.localeCompare(b.name,'fr')).map(e=>{
    const sk = stockKeyFor(e.name); let avail = 0;
    if(sk){ avail = Math.min(e.n, rem[sk]||0); rem[sk] = (rem[sk]||0)-avail; }
    return Object.assign(e,{avail,buy:e.n-avail});
  });
  return {mode,label,entries,rows,weeks,planned,missingWeeks};
}

/* ================= Synchronisation partagée (capacité db) ================= */
const COLLS = ['plans','fridge','custom','myIng','votes','prefs','off','adopted','excl','checked'];
const SYNC = {db:null, user:null, uid:null, state:'off', ready:false, readonly:false, bk:false, claiming:false, wait:true, defin:{}};
const SH = {}; COLLS.forEach(c=>{ SH[c]={}; }); SH.set = null;
const DEFER = {}; let PEND = 0, WQ = Promise.resolve(), RT = null;
const J = o => JSON.stringify(o,(k,v)=>k==='_v'?undefined:v);
function h36(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36); }
function docId(k){ return k.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,60)+'-'+h36(k); }

function desired(){
  const d = {plans:{},fridge:{},custom:{},myIng:{},votes:{},prefs:{},off:{},adopted:{},excl:{},checked:{}};
  Object.keys(S.plans).forEach(w=>{ d.plans[w]=J(S.plans[w]); });
  Object.keys(S.fridge).forEach(k=>{ d.fridge[docId(k)]=J(Object.assign({k},S.fridge[k])); });
  S.custom.forEach(c=>{ d.custom[c.id]=J(c); });
  S.myIng.forEach(i=>{ d.myIng[i.id]=J(i); });
  Object.keys(S.votes).forEach(id=>{ const v=S.votes[id]; if(v && (v.a||v.l)) d.votes[id]=J({a:v.a||0,l:v.l||0}); });
  Object.keys(S.prefs).forEach(id=>{ if(S.prefs[id]) d.prefs[id]=J({v:S.prefs[id]}); });
  Object.keys(S.off).forEach(id=>{ if(S.off[id]) d.off[id]=J({v:1}); });
  Object.keys(S.adopted).forEach(id=>{ if(S.adopted[id]) d.adopted[id]=J({v:1}); });
  Object.keys(S.excl).forEach(k=>{ if(S.excl[k]) d.excl[docId(k)]=J({k}); });
  Object.keys(S.checked).forEach(k=>{ if(S.checked[k]) d.checked[docId(k)]=J({k}); });
  return d;
}
function pushDiff(){
  if(!SYNC.ready || SYNC.readonly || !SYNC.db) return;
  const want = desired();
  COLLS.forEach(c=>{
    const w = want[c], sh = SH[c];
    Object.keys(w).forEach(id=>{
      if(sh[id]===w[id]) return;
      if(c==='votes' && sh[id]){
        const nw = JSON.parse(w[id]), od = JSON.parse(sh[id]), ch = {};
        ['a','l'].forEach(f=>{ if(nw[f]!==od[f]) ch[f]=nw[f]; });
        enqueue({c,id,op:'update',data:ch,full:nw});
      } else enqueue({c,id,op:'set',data:JSON.parse(w[id])});
      sh[id] = w[id];
    });
    Object.keys(sh).forEach(id=>{ if(!(id in w)){ enqueue({c,id,op:'delete'}); delete sh[id]; } });
  });
  const sj = J(S.set);

async function runOp(op){

function applyColl(c, docs){
  const map = {}; docs.forEach(d=>{ map[d.id]=J(d.data); });
  const sh = SH[c], ks = Object.keys(map), os = Object.keys(sh);
  if(ks.length===os.length && ks.every(k=>sh[k]===map[k])) return false;
  if(ks.length && !SYNC.bk){
    SYNC.bk = true;
    try{ const raw=localStorage.getItem(KEY); if(raw && !localStorage.getItem(KEY+'-avant-sync')) localStorage.setItem(KEY+'-avant-sync',raw); }catch(e){}
  }
  SH[c] = map;
  const cl = docs.map(d=>({id:d.id,data:JSON.parse(map[d.id])}));
  const D = cl.map(x=>x.data);
  if(c==='plans'){ S.plans={}; cl.forEach(x=>{ S.plans[x.id]=x.data; }); }
  else if(c==='fridge'){ S.fridge={}; D.forEach(x=>{ S.fridge[x.k]={n:x.n,e:x.e,r:x.r,q:x.q}; }); }
  else if(c==='custom'){ S.custom = D.slice().sort((a,b)=>a.id<b.id?-1:1); }
  else if(c==='myIng'){
    S.myIng.filter(x=>!D.some(y=>y.id===x.id)).forEach(unapplyMyIng);
    D.filter(y=>!S.myIng.some(x=>x.id===y.id)).forEach(applyMyIng);
    S.myIng = D;
  }
  else if(c==='votes'){ S.votes={}; cl.forEach(x=>{ S.votes[x.id]={a:x.data.a||0,l:x.data.l||0}; }); }
  else if(c==='prefs'){ S.prefs={}; cl.forEach(x=>{ S.prefs[x.id]=x.data.v; }); }
  else if(c==='off' || c==='adopted'){ S[c]={}; cl.forEach(x=>{ S[c][x.id]=true; }); }
  else if(c==='excl'){ S.excl={}; D.forEach(x=>{ S.excl[x.k]=true; }); }
  else if(c==='checked'){ S.checked={}; D.forEach(x=>{ S.checked[x.k]=true; }); }
  return true;
}
function flushDefer(){

function p2pRecv(m){

function p2pDial(){

  else if(a==='rcopen'){ S.rc={stage:'in',text:'',rows:[],msg:''}; S.sheet='receipt'; S.open=null; S.focusModal=true; }

  else if(a==='rctog'){ const r=S.rc.rows[i]; if(r) r.on=!r.on; }
  else if(a==='rcqty'){ const r=S.rc.rows[i]; if(r) r.q=Math.max(1,Math.min(99,r.q+(+v))); }
  else if(a==='rcall'){ S.rc.rows.forEach(r=>{ r.on=v==='1'; }); }

    let n=0; const items=[];

  }
  else if(a==='p2pinv'){ if(!S.link){ const n=Date.now(); S.ts=S.ts||{}; P2C.forEach(c=>{ S.ts[c]=n; }); S.link={role:'host',slot:'a',me:'cm-'+p2pRid(),peer:'',token:p2pRid()}; S.who='a'; saveLocal(); p2pStart(); } }
  else if(a==='p2pshare'){ const u=p2pLink(); if(navigator.share) navigator.share({title:'Carnet de menus',text:'Rejoins mon carnet de menus pour voter ensemble :',url:u}).catch(()=>{}); else if(navigator.clipboard) navigator.clipboard.writeText(u).then(()=>toast('Lien copié')); else toast(u); }
  else if(a==='p2punlink'){ if(confirm('Délier les deux applis ? Chacun garde ses données sur son appareil.')){ p2pStop(); S.link=null; S.who=null; saveLocal(); } }

  else if(a==='seasononly'){ S.seasonOnly=!S.seasonOnly; }
  else if(a==='month'){ S.sm=+v; }

    cur[w] = cur[w]===val ? 0 : val; S.votes[id]=cur;
    if(S.prefs[id]===-1 && val===1) S.prefs[id]=0;

      const was = !isCandidate(dishById(id)); adopt(id); save();
      if(!was) toast('Validé à deux : ajouté à ta liste');
    } else save();
  }
  else if(a==='revote'){ S.votes[id]={a:0,l:0}; S.prefs[id]=0; save(); }

  else if(a==='cb'){ C.base=v; }

document.addEventListener('change', e=>{
  const el = e.target.closest('[data-sel]'); if(!el) return;
  const k = el.dataset.sel;
  if(k==='mode'){ S.set.mode=el.value; if(S.plans[S.week]){ delete S.plans[S.week]; generate(); toast('Semaine recomposée'); } save(); }

  else if(k==='air'){ S.set.air=el.checked; save(); }
  else if(k==='season'){ S.set.season=el.checked; save(); }
  else if(k==='cook'){ S.set.cook=el.checked; save(); }
  else if(k==='ufr'){ S.set.ufr=el.checked; save(); }
  else if(k==='chk'){ if(el.checked) S.checked[el.dataset.k]=true; else delete S.checked[el.dataset.k]; save(); }
  else if(k==='on'){ S.off[el.dataset.id] = !el.checked; save(); }
  else if(k==='cslot'){ C.slot=+el.value; return; }
  else if(k==='newtype'){ document.querySelectorAll('.ni-sub').forEach(x=>{ x.hidden = x.dataset.for!==el.value; }); return; }
  render();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && (S.open||S.sheet)){ S.open=null; S.sheet=null; render(); }
  if(e.key==='Enter' && e.target && e.target.id==='fr-in'){ e.preventDefault(); frAdd(); render(); } });

syncBases();
S.myIng.forEach(applyMyIng);
applyEdits();
p2pInit();
render();
initSync();
